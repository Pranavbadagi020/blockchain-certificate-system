# ── Production Spring Boot Properties ──
spring.application.name=certificate-backend

# Server
server.port=8080

# Production MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.certificate_backend=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.security=WARN

# Admin account
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Blockchain RPC & Smart Contract
app.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL}
app.blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS}
app.blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY}

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# AI Document Analysis
app.ai.enabled=${AI_ANALYSIS_ENABLED:true}
app.ai.provider=${AI_PROVIDER:offline}
app.ai.api-key=${AI_API_KEY:}
app.ai.endpoint=${AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
app.ai.timeout-ms=${AI_TIMEOUT_MS:3000}

# Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
