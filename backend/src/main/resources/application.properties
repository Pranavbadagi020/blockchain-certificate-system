spring.application.name=certificate-backend

# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── MongoDB ─────────────────────────────────────────────────────────────────
# Default: local MongoDB. Override via MONGODB_URI environment variable in prod.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/certchain}
spring.data.mongodb.auto-index-creation=true

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.certificate_backend=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Admin account configuration
app.admin.email=${ADMIN_EMAIL:admin@certchain.local}
app.admin.password=${ADMIN_PASSWORD:PranavAdmin@2024}

# ── Local Hardhat Blockchain ────────────────────────────────────────────────
app.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
app.blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
app.blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}

# ── Multipart Upload ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── JWT Authentication ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:CertChainSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS Configuration ──────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ── AI Analysis Configuration ───────────────────────────────────────────────
app.ai.enabled=${AI_ANALYSIS_ENABLED:true}
app.ai.provider=${AI_PROVIDER:offline}
app.ai.api-key=${AI_API_KEY:}
app.ai.endpoint=${AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
app.ai.timeout-ms=${AI_TIMEOUT_MS:3000}
