# ==============================================================================
# Isolated Test Configuration (Spring Boot Test Profile)
# This file is used exclusively during test execution (e.g., mvn test).
# It guarantees that automated tests CANNOT access or mutate the development
# or production MongoDB databases, accounts, or certificate records.
# ==============================================================================

spring.application.name=certificate-backend-test

# ── Isolated Test Database ───────────────────────────────────────────────────
# Explicitly uses "certchain_test" database. Never connects to "certchain".
spring.data.mongodb.uri=${TEST_MONGODB_URI:mongodb://localhost:27017/certchain_test}
spring.data.mongodb.auto-index-creation=true

# ── Isolated Test Admin Account ──────────────────────────────────────────────
# Dedicated test email and credentials completely separate from development/production.
app.admin.email=test-admin@certchain.test
app.admin.password=TestAdminPassword123!
app.admin.initialize=false

# ── Test Security & JWT ──────────────────────────────────────────────────────
app.jwt.secret=TestCertChainSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026
app.jwt.expiration-ms=3600000

# ── Test Blockchain Settings (Dummy / Mock / Test) ───────────────────────────
app.blockchain.rpc-url=http://127.0.0.1:8545
app.blockchain.contract-address=0x5FbDB2315678afecb367f032d93F642f64180aa3
app.blockchain.private-key=

# ── Test AI Settings ─────────────────────────────────────────────────────────
app.ai.enabled=false
app.ai.provider=offline
