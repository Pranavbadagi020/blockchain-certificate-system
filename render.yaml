services:
  # Spring Boot Backend REST API
  - type: web
    name: certchain-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        value: PranavAdmin@2024
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,http://localhost:5173"

  # React Frontend Static Site
  - type: static
    name: certchain-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: certchain-backend
          property: host
